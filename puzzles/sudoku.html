<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="数独を、メモ・ヒント・途中保存付きで遊べます。">
  <title>数独 — YourLogic</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23142d35'/%3E%3Cpath d='M16 15h32v34H16zM27 15v34M38 15v34M16 27h32M16 38h32' fill='none' stroke='%23c8f135' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/sudoku.css?v=20260917-1">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="../index.html"><span class="brand-mark" aria-hidden="true">YL</span><span class="brand-text">YourLogic</span></a>
      <nav class="site-nav" aria-label="パズルナビゲーション"><a href="../index.html#puzzles">パズルを変える</a></nav>
      <div class="timer-area game-clock" aria-label="経過時間"><span>TIME</span><strong id="timer">00:00</strong></div>
    </div>
  </header>

  <main class="game-shell">
    <section class="game-heading">
      <div>
        <a class="back-link" href="../index.html">← パズル一覧</a>
        <p class="eyebrow">NUMBER PLACEMENT</p>
        <h1>数独</h1>
      </div>
      <div class="heading-status">
        <span id="play-mode-label" class="play-mode-label" hidden></span>
        <div id="auth-status-text" class="player-status">プレイヤー状態を確認中…</div>
      </div>
    </section>

    <div class="game-layout">
      <section class="play-column">
        <div class="mode-bar surface" aria-label="入力設定">
          <div class="input-mode-selector" role="group" aria-label="入力方法">
            <button id="mode-location-btn" class="mode-btn active" type="button">マス→数字</button>
            <button id="mode-auto-btn" class="mode-btn" type="button">数字→マス</button>
          </div>
          <button id="memo-btn" class="mode-btn memo-button" type="button">メモ: OFF</button>
        </div>

        <div class="board-wrap surface">
          <div class="sudoku-board" id="board" role="grid" aria-label="数独の盤面"></div>
        </div>

        <div class="num-pad" aria-label="数字入力">
          <button class="num-btn" data-num="1" type="button">1</button><button class="num-btn" data-num="2" type="button">2</button>
          <button class="num-btn" data-num="3" type="button">3</button><button class="num-btn" data-num="4" type="button">4</button>
          <button class="num-btn" data-num="5" type="button">5</button><button class="num-btn" data-num="6" type="button">6</button>
          <button class="num-btn" data-num="7" type="button">7</button><button class="num-btn" data-num="8" type="button">8</button>
          <button class="num-btn" data-num="9" type="button">9</button><button class="num-btn clear-btn" data-num="" type="button">消す</button>
        </div>
      </section>

      <aside class="side-column">
        <section id="mistake-panel" class="mistake-panel" role="alert" aria-live="assertive" hidden>
          <button id="dismiss-mistakes-btn" class="mistake-close" type="button" aria-label="警告と赤枠を閉じる">×</button>
          <strong>❌ この数字は間違えています。</strong>
          <p id="mistake-message">消してやり直してみましょう。</p>
          <button id="clear-mistakes-btn" class="btn btn-danger btn-block" type="button">該当する数字を全て消す</button>
        </section>
        <div id="hint-text-area" class="notice hint-box" role="status" aria-live="polite" style="display:none"></div>
        <section class="tool-card surface">
          <h2>サポート</h2>
          <div class="controls">
            <button class="btn btn-primary btn-block action-btn" id="check-btn" type="button">答え合わせ</button>
            <button class="btn btn-secondary btn-block action-btn" id="hint-btn" type="button">ヒントを見る</button>
            <button class="btn btn-secondary btn-block action-btn" id="undo-btn" type="button" disabled>一個もどる</button>
            <button class="text-button action-btn" id="giveup-btn" type="button">解答を表示する</button>
          </div>
        </section>
        <section class="rule-card">
          <strong>入力のコツ</strong>
          <ul>
            <li>空白キーまたは M でメモ切替</li>
            <li>矢印キーで選択マスを移動</li>
            <li>⌘Z / Ctrl+Zで一個もどる</li>
            <li>入力内容は自動で保存</li>
          </ul>
        </section>
      </aside>
    </div>
  </main>

  <script type="module" src="../js/puzzles/sudoku/sudoku.js?v=20260917-1"></script>
</body>
</html>
